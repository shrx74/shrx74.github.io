name: Generate portfolio social preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/social-preview.yml"

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install screenshot browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Capture landing page
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          const path = require('path');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1200, height: 630 }, deviceScaleFactor: 1, reducedMotion: 'reduce' });
            await page.goto('file://' + path.join(process.cwd(), 'index.html'), { waitUntil: 'load' });
            await page.evaluate(() => document.fonts.ready);
            await page.screenshot({ path: 'social-preview.png', animations: 'disabled' });
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          JS
      - name: Commit screenshot to site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-preview.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate landing page preview image"
            git push
          fi
